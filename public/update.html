<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>更新网站 · 大学生婚恋意愿调查</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #f7f6f2; color: #243b4b; font: 16px/1.8 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    main { max-width: 580px; margin: 10vh auto; }
    .brand { font-size: 13px; letter-spacing: 2px; border-bottom: 1px solid #d9dfdc; padding-bottom: 20px; }
    h1 { font-size: 30px; font-weight: 600; margin: 36px 0 16px; }
    p { color: #637078; }
    button { border: 0; border-radius: 3px; background: #243b4b; color: #fffefa; padding: 14px 24px; min-height: 48px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    a { color: inherit; text-underline-offset: 4px; }
    #status { min-height: 2em; margin: 20px 0; }
    .help { font-size: 14px; border-top: 1px solid #d9dfdc; padding-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">大学生婚恋意愿调查</div>
    <h1>更新调查网站</h1>
    <p>如果刷新后仍然看到旧版，请在联网时更新页面资源。当前浏览器中的问卷草稿和提交副本会保留。</p>
    <button id="update">更新并返回 ↻</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="help">更新完成后将返回调查首页。请保持网络连接；更新失败时可重试，不会清除已有的问卷回答。</p>
    <a href="./">返回调查首页 →</a>
  </main>
  <script src="./update.js"></script>
</body>
</html>
